name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, use Security → Report a vulnerability."
  - type: input
    id: version
    attributes:
      label: Package and version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the code or steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include runtime, framework, and tool versions where relevant.
